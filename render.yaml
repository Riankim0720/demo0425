services:
  - type: web
    name: notespace
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_TURSO_URL
        sync: false
      - key: VITE_TURSO_AUTH_TOKEN
        sync: false
